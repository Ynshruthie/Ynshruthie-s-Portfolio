<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Card / Certificate - Ynshruthie</title>
    <link rel="stylesheet" href="profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Modern, premium accents for markscard page */
        .mc-tabs-container {
            margin-bottom: 24px;
            text-align: center;
        }
        .mc-tabs-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            margin-bottom: 12px;
            font-weight: 700;
        }
        .mc-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .mc-tab-btn {
            background: #fff;
            border: 1.5px solid var(--border);
            color: var(--brown);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(74,44,17,0.04);
        }
        .mc-tab-btn:hover {
            border-color: var(--brown);
            background: rgba(74,44,17,0.02);
            transform: translateY(-1px);
        }
        .mc-tab-btn.active {
            background: var(--brown);
            color: #fff;
            border-color: var(--brown);
            box-shadow: 0 4px 12px rgba(74,44,17,0.15);
        }
        .mc-pdf-frame {
            width: 100%;
            height: 650px;
            border: none;
            display: block;
            border-radius: var(--radius-sm);
        }
        .mc-action-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 25px;
        }
        .mc-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--brown);
            color: #fff !important;
            padding: 12px 26px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(74,44,17,0.15);
        }
        .mc-action-btn:hover {
            background: var(--dark-brown);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74,44,17,0.22);
        }
        .mc-action-btn i {
            font-size: 1.1rem;
        }
        /* Make mc-image-area flexible when showing iframe */
        .mc-image-area.has-pdf {
            min-height: auto;
            background: transparent;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="markscard-page">

        <!-- Back Button -->
        <a href="profile.html" class="mc-back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Profile</a>

        <div class="markscard-container">
            <div id="mc-header" class="mc-header">
                <div class="mc-icon" id="mc-icon"><i class="fa-solid fa-file-lines"></i></div>
                <div>
                    <h1 id="mc-title">Loading...</h1>
                    <p id="mc-subtitle" class="mc-subtitle"></p>
                </div>
            </div>

            <!-- Dynamic Semester tabs container (only shown for BSC) -->
            <div id="mc-tabs-container" class="mc-tabs-container hidden">
                <p class="mc-tabs-title">Select Semester Document</p>
                <div id="mc-tabs" class="mc-tabs"></div>
            </div>

            <!-- Image/PDF viewer area -->
            <div class="mc-image-area" id="mc-image-area">
                <!-- When image is uploaded, it shows here -->
                <div class="mc-placeholder" id="mc-placeholder">
                    <i class="fa-solid fa-image fa-3x"></i>
                    <p>Marks card / Certificate image coming soon!</p>
                    <span class="mc-upload-note">The document for <strong id="mc-placeholder-name"></strong> will be added here.</span>
                </div>
                <img id="mc-img" src="" alt="Marks Card" class="mc-document-img hidden">
            </div>

            <!-- Dynamic Action button for PDFs/Downloads -->
            <div id="mc-action-container" class="mc-action-btn-container hidden">
                <a id="mc-action-link" href="#" target="_blank" class="mc-action-btn">
                    <i class="fa-solid fa-file-pdf"></i> Open PDF in New Tab
                </a>
            </div>

            <!-- Details table (for education) -->
            <div id="mc-details" class="mc-details hidden"></div>
        </div>
    </div>

    <script>
        const EDU_DATA = {
            mca: {
                title: "MCA – Master of Computer Applications",
                subtitle: "REVA University · 2026 – Present",
                icon: "fa-laptop-code",
                color: "#2B3A67",
                details: [
                    { label: "Degree", value: "MCA" },
                    { label: "Specialization", value: "Computer Science & Applications" },
                    { label: "Institute", value: "REVA University" },
                    { label: "Year", value: "2026 – Present" },
                    { label: "CPI", value: "9.04" }
                ],
                img: ""  // keep empty to trigger placeholder since it is ongoing
            },
            bsc: {
                title: "BSC – Bachelor of Science",
                subtitle: "REVA University · July 2024",
                icon: "fa-flask",
                color: "#3a6b2b",
                details: [
                    { label: "Degree", value: "BSC" },
                    { label: "Specialization", value: "Mathematics, Statistics & Computer Science" },
                    { label: "Institute", value: "REVA University" },
                    { label: "Year", value: "July 2024" },
                    { label: "CPI", value: "8.90" }
                ],
                sems: [
                    { name: "1st Sem", img: "Assests/Degree 1st sem Markscard .pdf" },
                    { name: "2nd Sem", img: "Assests/ Degree 2nd sem Markscard.pdf" },
                    { name: "3rd Sem", img: "Assests/Degree 3rd sem Markscard.pdf" },
                    { name: "4th Sem", img: "Assests/Degree 4th sem Markscard.pdf" },
                    { name: "5th Sem", img: "Assests/Degree 5th sem Markscard.pdf" },
                    { name: "6th Sem", img: "Assests/Degree 6th sem Markscard.pdf" },
                    { name: "Degree Certificate", img: "Assests/ Degree Completion Certificate.pdf" }
                ],
                img: "Assests/Degree 6th sem Markscard.pdf" // default to 6th sem
            },
            "12th": {
                title: "12th Grade",
                subtitle: "REVA Independent PU College · July 2021",
                icon: "fa-school",
                color: "#6b2b2b",
                details: [
                    { label: "Level", value: "12th" },
                    { label: "Specialization", value: "Physics, Chemistry, Mathematics & Biology" },
                    { label: "Institute", value: "REVA Independent PU College" },
                    { label: "Year", value: "July 2021" },
                    { label: "Percentage", value: "87.83%" }
                ],
                img: "Assests/12th Markscard.pdf"
            },
            "10th": {
                title: "10th Grade",
                subtitle: "Allwin Public School · April 2019",
                icon: "fa-book",
                color: "#6b4f2b",
                details: [
                    { label: "Level", value: "10th" },
                    { label: "Board", value: "State Board" },
                    { label: "Institute", value: "Allwin Public School" },
                    { label: "Year", value: "April 2019" },
                    { label: "Percentage", value: "84.96%" }
                ],
                img: "Assests/10th Markscard .pdf"
            }
        };

        const CERT_DATA = {
            cisco: {
                title: "Cisco Certified Support Technician",
                subtitle: "Cybersecurity Certification",
                icon: "fa-shield-halved",
                color: "#1ba0d8",
                img: "Assests/Cisco Certified Support Technician Cybersecurity.pdf"
            },
            pragati: {
                title: "Pragati: Path to Future",
                subtitle: "Cohort 6",
                icon: "fa-seedling",
                color: "#27ae60",
                img: "Assests/Pragati_ Path to Future – Cohort 6.pdf"
            },
            devops: {
                title: "Code to Cloud: DevOps & Deployment",
                subtitle: "Power Bootcamp",
                icon: "fa-cloud-arrow-up",
                color: "#e67e22",
                img: "Assests/CODE TO CLOUD_ A DEVOPS & DEPLOYMENT POWER BOOTCAMP.jpeg"
            },
            ai: {
                title: "Artificial Intelligence Foundation",
                subtitle: "AI Certification",
                icon: "fa-brain",
                color: "#8e44ad",
                img: "Assests/Artificial Intelligence Foundation Certification.pdf"
            },
            django: {
                title: "Django Mastery: From Basics to Deployment",
                subtitle: "Full Course Certification",
                icon: "fa-python",
                color: "#092e20",
                img: "Assests/DJANGO MASTERY_ FROM BASICS TO DEPLOYMENT.jpeg"
            }
        };

        function renderDocument(filePath, title) {
            const viewerArea = document.getElementById("mc-image-area");
            const imgEl = document.getElementById("mc-img");
            const placeholderEl = document.getElementById("mc-placeholder");
            const actionContainer = document.getElementById("mc-action-container");
            const actionLink = document.getElementById("mc-action-link");

            // Remove any existing iframe
            const existingFrame = viewerArea.querySelector("iframe");
            if (existingFrame) {
                existingFrame.remove();
            }

            // Hide/reset default elements
            imgEl.classList.add("hidden");
            placeholderEl.classList.add("hidden");
            actionContainer.classList.add("hidden");
            viewerArea.classList.remove("has-pdf");

            if (!filePath) {
                // No document loaded, show placeholder
                placeholderEl.classList.remove("hidden");
                return;
            }

            const isPdf = filePath.toLowerCase().endsWith(".pdf");

            if (isPdf) {
                // Render PDF in Iframe
                viewerArea.classList.add("has-pdf");
                const iframe = document.createElement("iframe");
                iframe.src = `${filePath}#toolbar=0&navpanes=0&view=FitH`;
                iframe.className = "mc-pdf-frame";
                viewerArea.appendChild(iframe);

                // Show backup open action button
                actionLink.href = filePath;
                actionLink.innerHTML = `<i class="fa-solid fa-file-pdf"></i> Open ${title || "Document"} in New Tab`;
                actionContainer.classList.remove("hidden");
            } else {
                // Render Image
                imgEl.src = filePath;
                imgEl.onload = () => {
                    imgEl.classList.remove("hidden");
                };
                imgEl.onerror = () => {
                    placeholderEl.classList.remove("hidden");
                };

                // Show dynamic view button for images as well
                actionLink.href = filePath;
                actionLink.innerHTML = `<i class="fa-solid fa-up-right-from-square"></i> Open Image in New Tab`;
                actionContainer.classList.remove("hidden");
            }
        }

        // Read URL param
        const params = new URLSearchParams(window.location.search);
        const eduKey = params.get("edu");
        const certKey = params.get("cert");
        const key = eduKey || certKey;
        const data = eduKey ? EDU_DATA[key] : CERT_DATA[key];

        if (data) {
            document.title = data.title + " – Ynshruthie";
            document.getElementById("mc-title").textContent = data.title;
            document.getElementById("mc-subtitle").textContent = data.subtitle;
            document.getElementById("mc-placeholder-name").textContent = data.title;

            const iconEl = document.getElementById("mc-icon");
            iconEl.innerHTML = `<i class="fa-solid ${data.icon}"></i>`;
            iconEl.style.background = data.color;

            // Handle multi-sem BSC tabs
            if (data.sems) {
                const tabsContainer = document.getElementById("mc-tabs-container");
                const tabsEl = document.getElementById("mc-tabs");
                tabsContainer.classList.remove("hidden");

                data.sems.forEach((sem, idx) => {
                    const btn = document.createElement("button");
                    btn.className = "mc-tab-btn";
                    btn.textContent = sem.name;
                    // Default to last sem (6th Sem)
                    if (idx === 5) {
                        btn.classList.add("active");
                        renderDocument(sem.img, sem.name);
                    }
                    btn.addEventListener("click", () => {
                        // Deactivate others
                        tabsEl.querySelectorAll(".mc-tab-btn").forEach(b => b.classList.remove("active"));
                        btn.classList.add("active");
                        renderDocument(sem.img, sem.name);
                    });
                    tabsEl.appendChild(btn);
                });
            } else {
                // Standard single document loading
                renderDocument(data.img, data.title);
            }

            // Show details table for edu
            if (data.details) {
                const detailsEl = document.getElementById("mc-details");
                detailsEl.classList.remove("hidden");
                detailsEl.innerHTML = `<table class="mc-table">
                    ${data.details.map(d => `<tr><td class="mc-label">${d.label}</td><td class="mc-value">${d.value}</td></tr>`).join("")}
                </table>`;
            }
        } else {
            document.getElementById("mc-title").textContent = "Page Not Found";
        }
    </script>
</body>
</html>
