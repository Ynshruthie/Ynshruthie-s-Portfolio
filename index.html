<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yelika Nagashruthi - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <script>
        // Instant check to prevent loader flicker if already played
        if (sessionStorage.getItem('hasPlayedEntry')) {
            document.documentElement.classList.add('skip-loader');
        }
    </script>
</head>
<body>
    <div class="loader" id="loader">
        <!-- Cinematic Background Orbs -->
        <div class="golden-bokeh b-1"></div>
        <div class="golden-bokeh b-2"></div>
        <div class="golden-bokeh b-3"></div>
        <div class="golden-bokeh b-4"></div>
        
        <!-- Upward Floating Dust -->
        <div class="ambient-dust">
            <div class="dust d-1"></div><div class="dust d-2"></div><div class="dust d-3"></div>
            <div class="dust d-4"></div><div class="dust d-5"></div><div class="dust d-6"></div>
            <div class="dust d-7"></div><div class="dust d-8"></div><div class="dust d-9"></div>
            <div class="dust d-10"></div><div class="dust d-11"></div><div class="dust d-12"></div>
        </div>

        <div class="loader-content">
            <!-- 3D Gyroscope Center -->
            <div class="gyroscope">
                <div class="gyro-ring ring-x"></div>
                <div class="gyro-ring ring-y"></div>
                <div class="gyro-ring ring-z"></div>
            </div>
            
            <div class="glow-text">Entering Ynshruthie's World...</div>
            <div class="elegant-line"></div>
        </div>
    </div>

    <!-- Main Site Logo -->
    <div class="logo-container">
        <img src="Assests/logo.PNG" alt="Profile Logo" class="profile-logo-img">
        <div class="logo-text">Ynshruthie's Portfolio</div>
    </div>

    <!-- Main dynamic scene container -->
    <div id="scene-container">
        <!-- The background image (1536x1024) -->
        <img id="background-img" src="Assests/home.PNG" alt="Lush outdoor environment">

        <!-- Invisible, clickable hotspots that exactly match the elements in the picture -->
        
        <!-- Door 1 Hotspot (Left Mushroom House - Tech Career) -->
        <div class="hotspot" id="door1" data-label="Tech Career">
            <div class="hover-label">Enter the Tech Career World ✦</div>
        </div>

        <!-- Door 2 Hotspot (Right Mushroom House - Content Creator) -->
        <div class="hotspot" id="door2" data-label="Content Creator">
            <div class="hover-label">Enter the Content Creator World ✦</div>
        </div>

        <!-- Girl Hotspot (Sitting in the middle) -->
        <div class="hotspot" id="girl" data-label="My Profile">
            <div class="hover-label">Enter my profile ✦</div>
        </div>

        <!-- Ambient particles (leaves/fireflies) -->
        <canvas id="particle-canvas"></canvas>

        <!-- Ambient overlay for cozy lighting -->
        <div class="ambient-light"></div>
    </div>

    <!-- Floating Aesthetic Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 Yelika Nagashruthi. All Rights Reserved.</p>
    </footer>

    <!-- Modals -->
    <div id="door-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content glass">
            <h2 id="door-title">Enter World</h2>
            <p id="door-desc">Do you want to enter the Content Creator world or the Tech world?</p>
            <div class="modal-buttons">
                <button class="btn enter-btn" id="enter-btn">Enter</button>
                <button class="btn close-btn" id="cancel-door-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen Video Transition Overlay -->
    <div id="video-transition-overlay" class="hidden">
        <video id="transition-video" playsinline preload="auto" muted></video>
    </div>

    <!-- Magical Flash Overlay for Profile -->
    <div id="magic-flash-overlay"></div>

    <script src="script.js"></script>
</body>
</html>
