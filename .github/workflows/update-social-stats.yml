name: Update Social Statistics

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Live Statistics
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CHANNEL: UCOhEIzFSqQVifi-dAzyTBgw
          RAPID_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPID_HOST: instagram-scraper-ai3.p.rapidapi.com
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node fetch-stats.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add social-stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update social statistics [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
